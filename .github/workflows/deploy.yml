name: Deploy CodeStats 4.0.0

on:
  push:
    branches:
      - version-4.0.0
  # Lets you run the deploy by hand from the Actions tab (it deploys the branch you pick)
  workflow_dispatch:

# Two deploys at once would fight over the same folders on the server, so a newer push waits
# for the running one instead of starting beside it
concurrency:
  group: deploy-codestats
  cancel-in-progress: false

env:
  # The branch the server checks out. Keep it the same as the branch above.
  RELEASE_BRANCH: version-4.0.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Frontend Env
        run: |
          echo "${{ secrets.FRONTEND_ENV }}" > frontend/.env

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package Frontend
        run: |
          tar -czf frontend-dist.tar.gz -C frontend/dist .

      - name: Upload Frontend Bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend-dist.tar.gz"
          target: "/home/ubuntu"

      - name: Deploy Backend + Frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: RELEASE_BRANCH
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd /home/ubuntu/scope-cohorts

            git fetch origin

            git checkout "$RELEASE_BRANCH"

            git reset --hard "origin/$RELEASE_BRANCH"

            sudo rm -rf /var/www/codestats/*

            sudo tar -xzf /home/ubuntu/frontend-dist.tar.gz -C /var/www/codestats

            cd backend

            npm install

            # Fail the deploy here, before restarting, if the server cannot even load
            node --check server.js

            pm2 restart all

            pm2 save

            # Check the config first: a typo in nginx should stop the deploy, not take the site down
            sudo nginx -t
            sudo systemctl restart nginx

            rm -f /home/ubuntu/frontend-dist.tar.gz

            echo "Deployment of $RELEASE_BRANCH completed successfully"
